#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Validation
    runs-on: ubuntu-latest
    env:
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      D1_ENDPOINT: ${{ secrets.D1_ENDPOINT }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      EXT_FLAGS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Python tool cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            build/lint-venv
            build/coverage-venv
          key: ${{ runner.os }}-python-tools-${{ hashFiles('scripts/lint_strict.sh', 'scripts/coverage.sh') }}
          restore-keys: |
            ${{ runner.os }}-python-tools-
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'vcpkg.json', 'src/**', 'scripts/lint_strict.sh', 'scripts/coverage.sh') }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Check D1 secrets
        id: d1_secrets
        run: |
          if [[ -n "${D1_ACCOUNT_ID}" && -n "${D1_DATABASE_ID}" && -n "${D1_API_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "D1 secrets are not configured. Live integration and coverage will be skipped."
          fi
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format-11 ccache
      - name: Initialize ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
      - name: Run strict lint checks
        run: ./scripts/lint_strict.sh
      - name: Run SQL test suite
        run: make test
      - name: Run HTTP integration tests
        if: ${{ steps.d1_secrets.outputs.enabled == 'true' }}
        run: ./scripts/run_integration_tests.sh
      - name: Run coverage checks
        if: ${{ steps.d1_secrets.outputs.enabled == 'true' }}
        run: ./scripts/coverage.sh
      - name: Upload coverage artifact
        if: ${{ steps.d1_secrets.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/coverage.xml
      - name: Upload coverage to Codecov (PR)
        if: ${{ github.event_name == 'pull_request' && steps.d1_secrets.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          flags: d1
          name: d1-pr-coverage
          fail_ci_if_error: true
          verbose: true
      - name: Show ccache stats
        if: ${{ always() }}
        run: ccache --show-stats

  duckdb-stable-build:
    name: Build extension binaries
    needs: integration-tests
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.4
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.4
      extension_name: d1
